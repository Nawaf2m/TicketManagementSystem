spring.application.name=TicketManagementSystem

spring.datasource.url=jdbc:mysql://localhost:3306/TicketManagementSystem_dp
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect




spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

server.web.error.include-message=always
server.web.error.include-stacktrace=always

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB